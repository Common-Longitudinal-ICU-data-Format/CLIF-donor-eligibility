[project]
name = "clif-donor-identifier"
version = "2.1.0"
description = "CLIF Epidemiology of Potential and Actual Deceased Organ Donors"
requires-python = ">=3.9"
dependencies = [
    "polars>=0.20.0",
    "matplotlib>=3.7.0",
    "pyarrow>=12.0.0",
    "jupyter>=1.0.0",
    "matplotlib-venn>=1.1.2",
    "clifpy>=2.1.0",
    "pandas>=2.3.3",
    "sas7bdat>=2.2.3",
    "pyreadstat>=1.3.5",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
