# ── config/hospital_crosswalk.yaml ───────────────────────────────────────────
#
# Maps every raw adt.hospital_id to (a) its CMS Certification Number and (b) the
# analytic hospital used for reporting. Adapted for CLIF-donor from the shared
# CLIF hospital crosswalk, with two additions:
#
#   srtr_ccn_id   the CCN SRTR actually attributes donors to. Normally identical
#                 to hospital_ccn_id; differs when CMS has re-certified a
#                 facility but SRTR still files it under the old number.
#   ccn_in_srtr   verified against SRTR donorhospital2506 at build time.
#
# DENOMINATOR RULE. A hospital enters the analysis only when include_flag is
# true AND srtr_ccn_id resolves in SRTR. Anything else would put decedents in
# the denominator that can never have a donor in the numerator, deflating that
# site's donation rate. Rows failing either test are dropped as a recorded
# cohort-flow step, never silently.
#
# CCN structure: final four digits encode facility type —
#   0001-0879 short-term acute · 1300-1399 critical access · 2000-2299 long-term care
#
# analytic_hospital_id = <site>_<srtr_ccn_id>. Rows sharing a CCN coalesce into
# one analytic hospital by construction (NU McHenry+Huntley; Penn HUP+HUPME;
# UCSF Parnassus+Mission Bay+Mt Zion; UMN UMMC+Riverside).
#
# hospital_ccn_id and srtr_ccn_id are QUOTED — leading zeros (090005, 050454)
# are load-bearing.
# ─────────────────────────────────────────────────────────────────────────────

