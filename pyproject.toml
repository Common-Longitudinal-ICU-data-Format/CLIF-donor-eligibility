[project]
name = "clif-donor-identifier"
version = "2.1.0"
description = "CLIF Epidemiology of Potential and Actual Deceased Organ Donors"
# Pinned to the exact versions the pipeline was verified on at three sites
# (2026-10-09). Every site runs the same environment via `uv sync`. Bump a
# package deliberately with `uv lock --upgrade-package <pkg>` and re-verify,
# rather than letting a fresh resolve drift. Python is held to 3.12 because
# nothing else has been run.
requires-python = ">=3.12,<3.13"
dependencies = [
    "clifpy==2.1.0",
    "duckdb==1.4.1",
    "matplotlib==3.10.7",
    "numpy==2.3.4",
    "pandas==2.3.3",
    "polars==1.35.2",
    "psutil==7.1.3",        # peak-memory line in run_log.txt on Windows
    "pyarrow==22.0.0",
    "pyreadstat==1.3.5",    # coordinating centre only: SRTR SAS files
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[dependency-groups]
dev = [
    "pytest==9.0.0",
    "jupyter==1.1.1",     
]
