# ── config/donor_criteria.yaml ───────────────────────────────────────────────
# Single source of truth for every threshold and code set in this study.
# ─────────────────────────────────────────────────────────────────────────────

study:
  window_start_year: 2020
  window_end_year: 2025
  # A hospitalization is kept only if BOTH admission and discharge fall inside
  # the window, matching the calendar boundaries of the SRTR donor pull.
  require_admission_and_discharge_in_window: true
  death_discharge_category: expired      # 'hospice' is NOT a death

  # A death enters the cohort if the stay touched any of these ADT locations.
  cohort_locations: [ed, ward, stepdown, icu, hospice]
  suppress_small_cells: false
  small_cell_suppression_n: 11
  # exclusion_codes_by_step.csv can list, for the cancer step, every ICD-10 code
  # and how many excluded patients carried it. Most of those counts are below
  # the small-cell threshold and some are single patients with a rare diagnosis.
  # false: the per-code rows stay in the site's local folder and the shipped
  # file carries one row per step. Set true only once the small-cell policy for
  # the study allows it.
  ship_exclusion_code_detail: false

  # Hospitalizations of the same patient are linked into one encounter when the
  # next admission starts within this many hours of the previous discharge
  # (clifpy stitch_encounters; 6 is its default and the CLIF convention). Every
  # criterion is evaluated over the linked encounter.
  encounter_stitch_hours: 6

  # Time of death: the anchor for every "within N hours of death" window.
  # utils/death_time.py:
  #   death_dttm has a time of day  -> death_dttm
  #   death_dttm is only a date     -> discharge_dttm, kept inside that date
  #   death_dttm is missing         -> discharge_dttm
  # The last recorded vital is no longer a fallback.
  death_time:
    # A death recorded more than this many hours AFTER discharge is not the
    # in-hospital death (a registry date, or an error); discharge_dttm is used.
    max_hours_after_discharge: 24

# ── CLIF-donor (definition of interest) ──────────────────────────────────────
clif_donor:
  age_at_death_max: 75                   # inclusive: 75 or under
  # At least one IMV row in this many hours BEFORE the time of death. Rows after
  # death do not count.
  imv_hours_before_death: 48
  bmi_max: 50                            # inclusive: 50 or under
  # NO sepsis exclusion. Settled 2026-09-19; the sepsis codes and Table 2 row
  # were removed 2026-10-05.
  kidney:
    creatinine_max: 4.0                  # mg/dL, strict <
    exclude_if_crrt_within_hours: 48
  liver:
    total_bilirubin_max: 4.0             # mg/dL, strict <
    ast_max: 700                         # U/L, strict <
    alt_max: 700                         # U/L, strict <
  # A missing organ-quality value is ineligible. Absence of a CRRT record is
  # read as "not on dialysis".
  contraindications:
    # The excluding ICD-10-CM codes, one prefix per row (C34 covers C34.11).
    # Follows the OPTN eligible-death cancer exclusions; what is not excluded,
    # and why, is in guides/contraindications.md.
    icd10_file: utils/codes/icd10_contraindications.csv
    # A code counts at any diagnosis position, present on admission or not.
    positive_blood_culture_hours: 48

# ── CALC — secondary administrative comparator ───────────────────────────────
calc:
  # Age limit: the same as CLIF-donor (clif_donor.age_at_death_max).
  cause_icd10_prefixes:
    ischemic_heart_disease: ["I20", "I25"]
    cerebrovascular_disease: ["I60", "I69"]
    external_causes: ["V01", "Y89"]      # the rule prints "V-1-Y89", a typo for V01

  # No contraindication codes. 42 CFR 486.302 defines CALC by INCLUSION codes
  # only; CMS tested adding contraindication exclusions and declined, finding
  # "no additive value" (CMS-3380-F pp. 45, 51). The contraindication-based
  # definition in that document belongs to the December 2019 PROPOSED rule,
  # which was not adopted. 
  # [Reference](https://www.cms.gov/files/document/112020-opo-final-rule-cms-3380-f.pdf)

  # Which diagnosis position counts as the cause of death.
  #   any          every diagnosis position           <- PRIMARY ANALYSIS
  #   primary      principal discharge diagnosis only  <- sensitivity B
  #   primary_poa  principal AND present on admission  <- sensitivity C
  #
  # CMS specifies the PRIMARY cause of death, but that is the underlying cause
  # from a death certificate, which no EHR field reproduces. All three counts
  # are reported at every run; this sets which one becomes calc_flag.
  # Agreed with Joel and Emily 2026-09-20: A primary, B and C as sensitivity.
  diagnosis_position: any

# ── Ventilated Patient — HRSA form comparator ────────────────────────────────
# IMV within clif_donor.imv_hours_before_death of death, no age limit. The
# count with the age limit is reported beside it (ventilated_age_le75).

# ── Clinical care and contraindications (Table 3) ────────────────────────────
clinical_care:
  # Six neurologic procedure concepts for Table 3, as CPT codes and ICD-10-PCS
  # patterns. The file carries a description per code.
  procedures_file: utils/codes/neuro_procedures.csv
  medications:
    # mCIDE med_category values present in CLIF 2.1.
    corticosteroid_bolus: [dexamethasone, methylprednisolone, hydrocortisone]
    vasopressin:          [vasopressin]
    levothyroxine:        [levothyroxine]
    sedative:             [propofol, midazolam]
    analgesic:            [fentanyl]
    antiepileptic:        [valproate]
    # NOT AVAILABLE in CLIF 2.1: mannitol, hypertonic_saline (both arrive in 3.0);
    # levetiracetam, phenytoin, fosphenytoin (absent from 2.1 AND 3.0).
  fungemia:
    fluid_category: blood_buffy
    organism_regex: "candida|aspergill|cryptococc|fungus|yeast"
  contraindications_not_in_clif:
    # Absent from the mCIDE in BOTH 2.1 and 3.0.
    - strongyloides
    - chagas
    # Present in microbiology_culture's organism vocabulary but not in
    # microbiology_nonculture, where serologies live -> not capturable as a
    # donor screen.
    - toxoplasma
    - treponema_syphilis
    - hepatitis_serology
    # HIV serology is not capturable either, but HIV disease is (ICD-10 B20).
    # It is not an exclusion: CLIF-donor excludes on cancer only
    # (guides/contraindications.md).
    - hiv_serology

# ── Reporting lists ──────────────────────────────────────────────────────────
# Code lists that describe the cohort but decide nothing.
reporting:
  # Table 2 comorbidity rows (HCV, hypertension, diabetes, CVA) as ICD-10 prefixes.
  comorbidities_file: utils/codes/icd10_comorbidities.csv
  # Donor-related administrative procedure codes, checked for presence in the
  # extract (donor_administrative_code_availability.csv).
  donor_administrative_codes_file: utils/codes/donor_administrative_codes.csv
