# ── config/outlier_config.yaml ───────────────────────────────────────────────
# Plausibility ranges, applied in step 01 before any "last value" is chosen:
# a value outside its range is treated as not recorded. Only the entries the
# pipeline reads are listed (utils/outlier_handler.outlier_range); a range that
# is renamed or removed here stops the run rather than applying no bound.
# ─────────────────────────────────────────────────────────────────────────────

tables:
  hospitalization:
    age_at_admission:        {min: 0, max: 120}
  labs:
    lab_value_numeric:
      creatinine:            {min: 0.0, max: 20.0}
      bilirubin_total:       {min: 0.0, max: 80.0}
      ast:                   {min: 0, max: 20000}
      alt:                   {min: 0, max: 20000}
      bun:                   {min: 0.0, max: 250.0}
      sodium:                {min: 90.0, max: 210.0}
  vitals:
    vital_value:
      weight_kg:             {min: 20, max: 1100}
      height_cm:             {min: 50, max: 255}
      heart_rate:            {min: 0, max: 300}
  patient_assessments:
    numerical_value:
      gcs_total:             {min: 3, max: 15}
      rass:                  {min: -5, max: 4}
